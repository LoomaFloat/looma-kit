# Студия картинок: генерация, правка и галерея в своём бакете.
name: {{name}}
runtime: { kind: python, python: "3.12" }
processes:
  web: { cmd: "python studio.py", port: 8080, min: 0, max: 1, idle_stop: 10m }
data:
  bucket: {}          # картинки галереи (AWS_* и LOOMA_BUCKET в окружении)
gpu:
  draw: { model: Qwen-Image-2.1 }
# Инструмент для агентов (MCP): картинка по описанию, ответ — сама картинка.
channels:
  mcp:
    tools:
      - name: draw
        title: Нарисовать
        description: Нарисовать картинку по описанию и сохранить её в галерее студии.
        path: /api/draw
        input: { type: object, properties: { prompt: { type: string, description: Что нарисовать } }, required: [prompt] }
# Карточка в маркетплейсе — `looma publish` (берётся из релиза на prod).
listing:
  title: Студия картинок
  summary: Описание словами — картинка; любую картинку галереи можно поправить словами
  category: images
  tags: [картинки, правка]
