# Сервис на Looma Float: что запускать и что ему нужно.
# Справка по полям: https://docs.loomafloat.ru/reference/looma-yaml/
name: {{name}}
runtime: { kind: python, python: "3.12" }
processes:
  # Веб-процесс слушает 0.0.0.0:$PORT. С min: 0 он спит без запросов и просыпается
  # первым запросом; max: 1 означает один экземпляр.
  web: { cmd: "python app.py", port: 8080, min: 0, max: 1 }
# Модели, которые сервис вызывает своим токеном (LOOMA_APP_TOKEN):
# gpu:
#   chat: { model: Qwen3.8-Flash-Next-NVFP4 }
# События для charge и их цены в рублях; без price событие бесплатное:
# events:
#   - { name: answer, title: Ответ, price: 2 }
# Карточка в каталоге: `looma publish` отправит её с ценами на модерацию из релиза на prod.
# listing:
#   title: Мой сервис
#   summary: Что он делает, одной строкой
#   category: other      # assistants, images, video, text, code, data, business, education, fun
#   tags: [пример]
#   icon: icon.png       # PNG, JPEG или WebP до 256 КБ
