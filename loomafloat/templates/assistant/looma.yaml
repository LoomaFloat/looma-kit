# Чат-ассистент на большой модели: страница и потоковый ответ.
name: {{name}}
runtime: { kind: python, python: "3.12" }
processes:
  # Спит без запросов. Разговор хранится на странице у посетителя, поэтому сон его не теряет.
  web: { cmd: "python app.py", port: 8080, min: 0, max: 1, idle_stop: 10m }
gpu:
  # Модель, которую сервис вызывает своим токеном. Другую модель поменяйте здесь
  # и в ASSISTANT_MODEL (секрет) или в app.py.
  chat: { model: Qwen3.8-Flash-Next-NVFP4 }
# Событие для учёта по клиентам каталога: сервис отмечает каждый ответ.
# Цену события в рублях задаёт поле price, например `price: 2`; без цены событие бесплатное.
events:
  - { name: answer, title: Ответ }
# Каналы кроме веба: API по ключу клиента и инструмент для ИИ-агентов (MCP).
channels:
  api: {}
  mcp:
    tools:
      - name: ask
        title: Спросить ассистента
        description: Задать вопрос ассистенту и получить ответ целиком.
        path: /api/ask
        input: { type: object, properties: { question: { type: string } }, required: [question] }
# Необязательные секреты: ASSISTANT_SYSTEM задаёт характер ассистента, ASSISTANT_MODEL модель.
secrets: [ASSISTANT_SYSTEM, ASSISTANT_MODEL]
# Карточка в каталоге: `looma publish` отправит её с ценами на модерацию из релиза на prod.
listing:
  title: Ассистент
  summary: Чат с большой моделью, ответ печатается по мере генерации
  category: assistants
  tags: [чат, ассистент]
  # icon: icon.png       # PNG, JPEG или WebP до 256 КБ
