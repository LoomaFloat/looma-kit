# Видеостудия: ролик по описанию, галерея в своём бакете.
name: {{name}}
runtime: { kind: python, python: "3.12" }
processes:
  # Спит без запросов: ролик считает платформа, процесс помнит только номер
  # задания и заберёт готовый ролик при следующем заходе.
  web: { cmd: "python studio.py", port: 8080, min: 0, max: 1, idle_stop: 15m }
data:
  bucket: {}          # ролики галереи (AWS_* и LOOMA_BUCKET в окружении)
gpu:
  video: { model: MiniMax-H3 }
# Событие для учёта по клиентам маркетплейса: готовый ролик.
events:
  - { name: video, title: Ролик }
# Только для клиентов маркетплейса (ролик — минуты GPU): раскомментируйте.
# access: clients
# Карточка в маркетплейсе — `looma publish` (берётся из релиза на prod).
listing:
  title: Видеостудия
  summary: Ролик на 5 секунд по описанию словами
  category: video
  tags: [видео, генерация]
