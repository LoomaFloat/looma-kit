# Telegram-бот с генерацией изображений и видео.
name: {{name}}
runtime: { kind: python, python: "3.12" }
processes:
  # Всегда на связи: ролик считается минуты, и процесс должен дожить до
  # отправки. Чтобы экономить, можно min: 0 и idle_stop: 1h.
  web: { cmd: "python bot.py", port: 8080, min: 1 }
gpu:
  draw: { model: Qwen-Image-2.1 }
  video: { model: MiniMax-H3 }
# Токен от @BotFather: looma secrets set TELEGRAM_BOT_TOKEN=123:ABC…
secrets: [TELEGRAM_BOT_TOKEN]
# Обновления бота идут через площадку: она называет отправителя (X-Looma-Client).
# bot даёт ссылку t.me на карточке в каталоге, впишите своего.
channels:
  telegram: { webhook: /telegram }
# События для учёта по клиентам: готовое изображение и готовый ролик.
# Цену события в рублях задаёт поле price, например `price: 5`; без цены событие бесплатное.
events:
  - { name: picture, title: Изображение }
  - { name: video, title: Ролик }
# Карточка в каталоге: `looma publish` отправит её с ценами на модерацию из релиза на prod.
listing:
  title: Бот-художник
  summary: Telegram-бот рисует по описанию, правит фото по подписи и снимает ролики
  category: images
  tags: [telegram, изображения, видео]
