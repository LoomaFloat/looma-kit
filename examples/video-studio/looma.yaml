# Видеостудия: ролик по описанию, галерея в своём бакете.
# Собрана из шаблона video-studio (`looma init -t video-studio`).
# Имя занято сервисом в каталоге: перед `looma dev` и `looma deploy` задайте своё.
name: looma-video
runtime: { kind: python, python: "3.12" }
processes:
  # Спит без запросов: ролик считает платформа, процесс помнит только номер
  # задания и заберёт готовый ролик при следующем заходе.
  web: { cmd: "python studio.py", port: 8080, min: 0, max: 1, idle_stop: 15m }
data:
  bucket: {}          # ролики галерей (AWS_* и LOOMA_BUCKET в окружении)
gpu:
  video: { model: MiniMax-H3 }
# Событие для учёта по клиентам каталога: готовый ролик.
# Цену события в рублях задаёт поле price; без него событие бесплатное.
events:
  - { name: video, title: Ролик }
# Только для клиентов каталога: ролик занимает минуты работы модели, а галерея у каждого своя.
access: clients
# Карточка в каталоге: `looma publish` отправит её с ценами на модерацию из релиза на prod.
# Витрина сохраняет переносы строк: абзац пишется одной строкой, между абзацами пустая строка.
listing:
  title: Видеостудия
  summary: Ролик на 5 секунд по описанию словами
  description: |
    Опишите сцену, например «рыжая лиса бежит по снегу», и студия снимет короткий ролик. Съёмка идёт несколько минут. Страницу можно закрыть: готовый ролик будет ждать в вашей галерее.

    Ролики смотрятся прямо на странице. Галерея своя у каждого: чужие ролики не видны.
  category: video
  tags: [видео, генерация]
  icon: icon.png
