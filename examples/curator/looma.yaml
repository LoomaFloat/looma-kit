# Куратор рецептов: учебный сервис входа через Looma с правами.
# С согласия человека заводит черновик рецепта в его каталоге: настройку поверх модели.
# Имя занято сервисом в каталоге: перед `looma dev` и `looma deploy` задайте своё.
name: looma-curator
runtime: { kind: python, python: "3.12" }
processes:
  web: { cmd: "python app.py", port: 8080, min: 0, max: 1, idle_stop: 10m }
# Права в каталоге человека. catalog.draft: черновики весов, рецептов и моделей.
# Публикация записей требует ещё права catalog.publish; этому сервису оно не нужно.
# Человек подтверждает права на странице витрины, ключ приходит в X-Looma-Account-Key.
account: [catalog.draft]
# Ключ человека приходит только с его входом на витрине.
access: clients
# Модель-основу рецепта сервис не вызывает, поэтому раздела gpu нет.
# Другую основу задаёт секрет CURATOR_BASE: модель должна быть в каталоге.
secrets: [CURATOR_BASE]
listing:
  title: Куратор рецептов
  summary: Черновик рецепта в вашем каталоге по описанию задачи
  description: |
    Опишите словами, чем должна заниматься модель. Куратор заведёт в вашем каталоге Looma Float черновик рецепта: настройку поверх модели сети. Из черновика вы сделаете свою модель в кабинете автора.

    Сервис попросит разрешение заводить черновики в вашем каталоге. Денег, ключей и почты он не касается, а записи помечены его именем. Отозвать доступ можно в кабинете, раздел «Доступы сервисов».
  category: code
  tags: [рецепты, каталог, авторам]
  icon: icon.png
