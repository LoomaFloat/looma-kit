# Раскадровка: ролик со звуком по идее в одну строку.
# Сервис независимого автора на Looma Float: три модели по очереди.
# Имя занято сервисом в каталоге: перед `looma dev` и `looma deploy` задайте своё.
name: storyboard
runtime: { kind: python, python: "3.12" }
processes:
  # Модели считает платформа, процесс хранит только состояние проектов.
  # Спит без запросов: ролик в работе не теряется, номер задания хранится в проекте.
  web: { cmd: "python app.py", port: 8080, min: 0, max: 1, idle_stop: 15m }
data:
  bucket: {}            # проекты, кадры и ролики (AWS_* и LOOMA_BUCKET в окружении)
gpu:
  script: { model: Qwen3.8-Flash-Next-NVFP4 }    # 1. сценарий и промпты
  frames: { model: Qwen-Image-2.1 }              # 2. первый и последний кадр
  video:  { model: MiniMax-H3 }                  # 3. ролик со звуком
# Событие для учёта по клиентам каталога: готовый дубль.
# Цену события в рублях задаёт поле price; без него событие бесплатное.
events:
  - { name: video, title: Ролик }
# Ролик занимает минуты работы модели, а проекты у каждого свои: только для клиентов каталога.
access: clients
channels:
  mcp:
    tools:
      - name: make_video
        title: Снять ролик
        description: >-
          Снимает короткий ролик со звуком по описанию идеи: пишет сценарий,
          рисует первый кадр и снимает ролик на MiniMax-H3. Работает 7–10 минут,
          отвечает сразу номером проекта; готовность проверять инструментом video_status.
        path: /mcp/make_video
        input:
          type: object
          properties:
            idea: { type: string, description: "Идея ролика словами, по-русски или по-английски" }
            format: { type: string, enum: ["16:9", "9:16", "1:1"], description: "Формат кадра, по умолчанию 16:9" }
            seconds: { type: integer, enum: [5, 10], description: "Длительность в секундах, по умолчанию 5" }
          required: [idea]
      - name: video_status
        title: Статус ролика
        description: >-
          Состояние ролика по номеру проекта из make_video: в работе (с процентом
          съёмки), готов или ошибка. Ссылка page открывает проект в браузере.
        path: /mcp/video_status
        input:
          type: object
          properties:
            id: { type: string, description: "Номер проекта из ответа make_video" }
          required: [id]
# Карточка в каталоге: `looma publish` отправит её с ценами на модерацию из релиза на prod.
listing:
  title: Раскадровка
  summary: Ролик со звуком по одной фразе. Сценарий, кадры и съёмка на трёх моделях
  # Витрина сохраняет переносы строк: абзац пишется одной строкой, между абзацами пустая строка.
  description: |
    Опишите идею своими словами, например «старый маяк в шторм». Дальше работают три модели по очереди.

    Qwen пишет сценарий: что в кадре, как движется камера, что слышно. Промпты для следующих шагов можно поправить руками или попросить переписать.

    Qwen-Image рисует первый кадр в трёх вариантах. По желанию дорисует и последний, сохранив героев и стиль.

    MiniMax-H3 снимает ролик со звуком на 5 или 10 секунд, который начинается выбранным кадром. Съёмка занимает несколько минут; страницу можно закрыть, ролик будет ждать в ваших проектах. Можно снять несколько дублей и скачать лучший.

    Режим «Без остановок» проходит все шаги сам. Из Claude, Cursor и других ИИ-агентов сервис доступен как MCP-инструмент make_video.
  category: video
  tags: [видео, сценарий, раскадровка, генерация, звук]
  icon: icon.png
