# Студия изображений: генерация, правка и галерея в своём бакете.
# Собрана из шаблона image-studio (`looma init -t image-studio`).
# Имя занято сервисом в каталоге: перед `looma dev` и `looma deploy` задайте своё.
name: looma-studio
runtime: { kind: python, python: "3.12" }
processes:
  web: { cmd: "python studio.py", port: 8080, min: 0, max: 1, idle_stop: 10m }
data:
  bucket: {}          # изображения галерей (AWS_* и LOOMA_BUCKET в окружении)
gpu:
  draw: { model: Qwen-Image-2.1 }
# Событий нет: вызовы модели записываются на клиента каталога.
# Инструмент для ИИ-агентов (MCP): изображение по описанию, в ответе само изображение.
channels:
  mcp:
    tools:
      - name: draw
        title: Нарисовать
        description: Нарисовать изображение по описанию и сохранить его в галерее студии.
        path: /api/draw
        input: { type: object, properties: { prompt: { type: string, description: Что нарисовать } }, required: [prompt] }
# Только для клиентов каталога: у каждого своя галерея.
access: clients
# Карточка в каталоге: `looma publish` отправит её на модерацию из релиза на prod.
# Витрина сохраняет переносы строк: абзац пишется одной строкой, между абзацами пустая строка.
listing:
  title: Студия изображений
  summary: Изображение по описанию словами. Любое изображение из галереи можно поправить словами
  description: |
    Опишите, что нарисовать, и выберите формат: квадрат, горизонтальный или вертикальный. Меньше чем через минуту изображение появится в вашей галерее.

    Любое изображение из галереи можно поправить словами: «сделай фон закатным», «добавь шляпу». Исходник остаётся, правка ложится рядом.

    Галерея своя у каждого: чужие изображения не видны. Для ИИ-агентов есть инструмент MCP «Нарисовать», в ответ он присылает само изображение.
  category: images
  tags: [изображения, генерация, правка, mcp]
  icon: icon.png
