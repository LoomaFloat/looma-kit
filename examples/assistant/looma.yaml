# Ассистент: чат на большой модели с потоковым ответом.
# Собран из шаблона assistant (`looma init -t assistant`).
# Имя занято сервисом в каталоге: перед `looma dev` и `looma deploy` задайте своё.
name: looma-assistant
runtime: { kind: python, python: "3.12" }
processes:
  # Спит без запросов. Разговор хранится в браузере, поэтому сон его не теряет.
  web: { cmd: "python app.py", port: 8080, min: 0, max: 1, idle_stop: 10m }
gpu:
  # Другую модель поменяйте здесь и в секрете ASSISTANT_MODEL (или в app.py).
  chat: { model: Qwen3.8-Flash-Next-NVFP4 }
# Событие для учёта по клиентам каталога: сервис отмечает каждый ответ.
# Цену события в рублях задаёт поле price; без него событие бесплатное.
events:
  - { name: answer, title: Ответ }
# Каналы кроме веба: API по ключу клиента и инструмент для ИИ-агентов (MCP).
channels:
  api: {}
  mcp:
    tools:
      - name: ask
        title: Спросить ассистента
        description: Задать вопрос ассистенту и получить ответ целиком.
        path: /api/ask
        input: { type: object, properties: { question: { type: string } }, required: [question] }
# Необязательные секреты: ASSISTANT_SYSTEM задаёт характер ассистента, ASSISTANT_MODEL модель.
secrets: [ASSISTANT_SYSTEM, ASSISTANT_MODEL]
# Только для клиентов каталога: у каждого своя история и свой учёт.
access: clients
# Карточка в каталоге: `looma publish` отправит её с ценами на модерацию из релиза на prod.
# Витрина сохраняет переносы строк: абзац пишется одной строкой, между абзацами пустая строка.
listing:
  title: Ассистент
  summary: Чат с большой моделью, ответ печатается по мере генерации
  description: |
    Задайте вопрос словами. Ассистент ответит по делу и продолжит разговор с учётом сказанного. Ответ появляется сразу и печатается по мере генерации.

    Подходит для черновиков писем и текстов, объяснений, идей и разбора задач. Разговор хранится только в вашем браузере.

    Ассистента можно подключить к своему ИИ-агенту инструментом MCP «Спросить ассистента» или вызывать по API с ключом клиента. Ключ выпускается на странице сервиса.
  category: assistants
  tags: [чат, ассистент, тексты, mcp]
  icon: icon.png
