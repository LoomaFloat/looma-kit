name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip skills (папка skill — верхний уровень архива)
        run: |
          mkdir -p dist
          cd skills
          for skill in */; do
            name="${skill%/}"
            zip -r "../dist/${name}.zip" "$name" -x "*/__pycache__/*"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
