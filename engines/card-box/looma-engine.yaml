# Учебный движок-образ, которому нужна видеокарта. Площадка собирает его по
# Dockerfile и запускает в песочнице на своей машине; реплика получает одну
# карту и видит только её.
name: card-box
title: Учебный движок на видеокарте
text: Отвечает, какую видеокарту видит и сколько на ней памяти. Образец движка-образа с видеокартой.
kinds: [text]
image:
  dockerfile: Dockerfile
  port: 8000
weights: none
requires:
  device: [cuda]
  vram_gib: 1      # сколько свободной памяти карты нужно реплике
  ram_gib: 2       # оперативная память: в песочнице это предел, а не пожелание
  cpus: 1
